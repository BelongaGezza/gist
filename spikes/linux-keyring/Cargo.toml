[package]
name = "gist-linux-keyring-spike"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
gist-store = { path = "../../crates/gist-store" }
zbus = "6"
num-bigint = "0.4"
hkdf = "0.13"
sha2 = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
getrandom = "0.3"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
gist-core = { path = "../../crates/gist-core" }
