[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # File-level copyleft only (not project-wide) — required transitively by
    # uniffi (ADR-001's mandated FFI layer) and by scraper (ADR-005 web
    # readability extraction). Accepted per architect decision 2026-09-10.
    "MPL-2.0",
    # Permissive *data* license (Linux Foundation), not a code license — no
    # share-alike, no field-of-use restriction, comparable in spirit to the
    # permissive licenses above. Covers only webpki-roots' bundled Mozilla
    # root-CA-certificate dataset, required transitively via ureq's `tls`
    # feature (gist-web's HTTPS client). Accepted 2026-09-19 as part of the
    # N7 dependency-upgrade pass (rustls-webpki RUSTSEC fixes).
    "CDLA-Permissive-2.0",
]
# Anything not in `allow` above is rejected by default — this is what keeps
# GPL-2.0/GPL-3.0/AGPL-3.0/LGPL-2.0/LGPL-3.0 out (cargo-deny >=0.14 removed
# the `licenses.deny` key; an allow-list alone enforces the same policy).

[advisories]
# Block crates with published RUSTSEC advisories.
# Set to "deny" to treat any advisory as a hard failure.
version = 2
ignore = []

[bans]
# Prevent duplicate versions of the same crate (can loosen with `allow`).
multiple-versions = "warn"
wildcards = "deny"          # forbid wildcard dep specs
# In-workspace `path = "../x"` deps have no `version =`, which Cargo treats
# as an implicit "*" requirement — this permits that for path/git deps only,
# while still catching a genuine `foo = "*"` crates.io wildcard dependency.
allow-wildcard-paths = true
deny = [
    # Forbid OpenSSL — use rustls throughout.
    { name = "openssl" },
    { name = "openssl-sys" },
    # Forbid tokio — gist-web uses ureq (sync). If tokio appears, something
    # pulled it transitively.
    { name = "tokio" },
]

[sources]
# Only allow crates from crates.io; no git or path deps in the published graph.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
