[package]
name = "gist-store"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
gist-model = { path = "../gist-model" }
rusqlite = { version = "0.40", features = ["bundled", "backup", "serde_json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
directories = "6"
tracing = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
aes-gcm = "0.11"

[dev-dependencies]
tempfile = "3"
# Integration tests (`tests/`) link only the crate under test plus its
# dev-dependencies, so these two must be repeated here even though they are
# already regular dependencies above.
gist-model = { path = "../gist-model" }
rusqlite = { version = "0.40", features = ["bundled"] }
