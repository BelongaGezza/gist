[package]
name = "gist-ffi"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
# rlib: lets examples/tests link the crate (release-mode panic_containment probe).
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
gist-core = { path = "../gist-core" }
# For `TokenKind`, mirrored as `FfiTokenKind` so an RSVP reader view can tell
# a word from a paragraph/section break without re-deriving it from the text.
gist-model = { path = "../gist-model" }
gist-rsvp  = { path = "../gist-rsvp" }
gist-store = { path = "../gist-store" }
uniffi     = "0.32"
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
# Tests only (R3, ADR-013 / `A4`): a real temp-dir `GistCore` round trip for
# `verify_item_integrity`/`verify_library_integrity`, same version the rest
# of the workspace already uses (gist-core/gist-store).
tempfile = "3"

[features]
# Pulls in uniffi's clap-based CLI so `uniffi-bindgen` can be built and
# installed as a standalone binary (uniffi 0.28+ no longer ships one on
# crates.io). Not enabled for the library/xcframework build.
uniffi-bindgen-bin = ["uniffi/cli"]
# Exposes `test_support::ffi_panic_probe`, used only by the `panic_containment`
# example that CI runs in release mode (see docs/review-pre-w1-quality-security.md Q1).
# Never enabled for shipped builds.
test-panic = []

[[example]]
name = "panic_containment"
required-features = ["test-panic"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-bindgen-bin"]

