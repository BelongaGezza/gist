version: 2
updates:
  # Compensating control for cargo-deny's advisories check, which currently
  # can't run in this dev environment (see CLAUDE.md's Security policies
  # section — cargo-deny 0.18.3's bundled RustSec DB parser can't read a
  # CVSS 4.0 entry; the fix needs cargo-deny 0.20+/rustc 1.88+). Weekly
  # version-bump PRs surface most new advisories via updated dependency
  # versions independent of that local tooling gap. This file also needs
  # "Dependabot alerts" and "Dependabot security updates" enabled in the
  # repo's Settings > Security page — that's an account-level toggle, not
  # something a config file can turn on.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"

  # fuzz/ is its own Cargo workspace with its own tracked Cargo.lock, which the
  # "/" entry above does not index. Without this, the fuzz lockfile silently
  # goes stale and accumulates advisories (quick-xml, rustls-webpki, time).
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "fuzz"

  # Companion to F3's SHA-pinning policy (every `uses:` line pinned to a full
  # commit SHA) — Dependabot opens a PR to bump the pin (with the version
  # comment) when a new release lands, so pinning doesn't silently calcify.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # Windows app (docs/windows-development-plan.md 4.2). Versions are pinned centrally in
  # apps/windows/Directory.Packages.props with committed packages.lock.json files; Dependabot
  # bumps both. Grouped so related packages move together in one PR.
  - package-ecosystem: "nuget"
    directory: "/apps/windows"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "windows"
    groups:
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK*"
          - "Microsoft.Windows.SDK.BuildTools*"
      dotnet-runtime-libs:
        patterns:
          - "System.*"
          - "CommunityToolkit.*"
