name: release-macos
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # The `release` job below overrides this to `contents: write` at the JOB
  # level (not here) for exactly the one step that publishes a GitHub
  # Release and uploads the DMG asset — see that job's own `permissions:`
  # block and its comment for why. Keep the workflow-level default at
  # read-only.

jobs:
  release:
    runs-on: macos-latest
    # Scoped write, only for this job, only because it calls `gh release
    # create`/asset-upload at the end. Every other step in this job (build,
    # sign, notarise) only needs the default read access above.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Fail fast, before spending any build/Xcode minutes, and with a
      # specific message naming exactly which secret is missing — not a
      # generic "codesign failed" error 20 minutes into the job. Confirmed
      # 2026-09-28 (see docs/m4-agent-roles.md's header): this dev
      # environment has neither a real signing identity nor notarization
      # credentials, so none of these secrets can be set or tested for real
      # here — this step is written and ready to run once a human configures
      # them in the repo's Settings → Secrets and variables → Actions.
      - name: Verify release signing secrets are configured
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()
          [ -z "$APPLE_DEVELOPER_ID_CERT_P12" ] && missing+=("APPLE_DEVELOPER_ID_CERT_P12 — base64-encoded Developer ID Application .p12 certificate (base64 -i cert.p12 | pbcopy)")
          [ -z "$APPLE_DEVELOPER_ID_CERT_PASSWORD" ] && missing+=("APPLE_DEVELOPER_ID_CERT_PASSWORD — the password that protects that .p12 file")
          [ -z "$APPLE_TEAM_ID" ] && missing+=("APPLE_TEAM_ID — Apple Developer Team ID (e.g. ABCDE12345), used for DEVELOPMENT_TEAM and notarytool --team-id")
          [ -z "$APPLE_ID" ] && missing+=("APPLE_ID — Apple ID email used for notarytool --apple-id (see tools/notarize.sh)")
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing+=("APPLE_APP_SPECIFIC_PASSWORD — app-specific password for notarytool --password (see tools/notarize.sh)")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: release-macos cannot run — the following repo secret(s) are not configured:" >&2
            echo >&2
            for m in "${missing[@]}"; do
              echo "  - $m" >&2
            done
            echo >&2
            echo "Set these under this repo's Settings -> Secrets and variables -> Actions" >&2
            echo "before pushing a release tag. See docs/development-plan-v2.md section 5 (M4)" >&2
            echo "and tools/notarize.sh for what each credential is used for." >&2
            exit 1
          fi

          echo "All required release-signing secrets are present."

      # Same xcode-version pinning rationale as apple-build.yml: this
      # repo's deploymentTarget (project.yml) tracks a current OS, so pin to
      # latest-stable rather than an exact Xcode version that would go
      # stale on GitHub's shared runner image.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-macos-

      # Same install pattern as apple-build.yml: XcodeGen isn't preinstalled
      # on the runner image, and installing a bare Homebrew formula file
      # outside a registered tap is rejected by current Homebrew — download
      # the project's own pinned release archive instead.
      - name: Install XcodeGen (pinned 2.46.0)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp
          sudo /tmp/xcodegen/install.sh

      # Same rationale as apple-build.yml: uniffi 0.28+ builds its own
      # uniffi-bindgen via the uniffi-bindgen-bin feature, needing a newer
      # MSRV than rust-toolchain.toml's pin, so it's built with `+stable`.
      - name: Install uniffi-bindgen
        run: |
          cargo +stable install --path crates/gist-ffi --bin uniffi-bindgen \
            --features uniffi-bindgen-bin --root "$HOME/.cargo-uniffi-bindgen"
          echo "$HOME/.cargo-uniffi-bindgen/bin" >> "$GITHUB_PATH"

      - name: Build gist-ffi xcframework + Swift bindings
        run: ./tools/build-core-xcframework.sh

      - name: xcodegen generate
        working-directory: apps/apple
        run: xcodegen generate

      # Standard GitHub Actions pattern for a short-lived, job-scoped
      # keychain: import the Developer ID cert into a throwaway keychain
      # (random password, never persisted anywhere) rather than the
      # runner's default login keychain, and clean it up unconditionally at
      # the end of the job (see the last step).
      - name: Import Developer ID signing certificate
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          echo "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/"//g')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: xcodebuild archive
        working-directory: apps/apple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project GIST.xcodeproj \
            -scheme GISTmacOS \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/GISTmacOS.xcarchive" \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export signed .app (Developer ID)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GISTmacOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # GISTmacOS's PRODUCT_NAME override is "GIST" (see project.yml / the
      # F25 note in CLAUDE.md's security register), so the exported bundle
      # is GIST.app, not GISTmacOS.app.
      - name: Build DMG
        run: ./tools/build-dmg.sh "$RUNNER_TEMP/export/GIST.app" "$RUNNER_TEMP/GIST.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./tools/notarize.sh "$RUNNER_TEMP/GIST.dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$RUNNER_TEMP/GIST.dmg" \
            --title "GIST ${{ github.ref_name }}" \
            --generate-notes

      # Always runs, even if an earlier step failed, so a partial/failed
      # release run never leaves the imported certificate sitting in a
      # keychain on the (ephemeral, but still) runner.
      - name: Clean up temporary signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
