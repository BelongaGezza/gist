name: core-quality
on:
  pull_request:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      # v2.1.1 bundles cargo-deny 0.20.2 in its own Docker image (independent
      # of this job's host rustc) — the first version able to parse RUSTSEC's
      # CVSS 4.0 advisory entries, which v1.6.3's bundled 0.18.3 could not
      # (see CLAUDE.md's security register / docs/security-review-v2.md).
      # `check advisories` now genuinely runs instead of erroring out before
      # it can — and finds real, previously-invisible findings; see the
      # commit that bumps this for the follow-up register entry.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit
      # fuzz/ is a separate workspace with its own tracked lockfile; the
      # bare `cargo audit` above only sees the root Cargo.lock.
      - run: cargo audit --file fuzz/Cargo.lock
