name: parser-corpus

on:
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  push:
    paths:
      - 'crates/gist-parse-*/**'
      - 'crates/gist-web/**'
      - 'crates/gist-core/**'
      - 'fixtures/**'
      - '.github/workflows/parser-corpus.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  corpus:
    name: parser corpus — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-corpus-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-corpus-

      - name: Run parser corpus tests
        run: cargo test --test corpus --package gist-core -- --nocapture

      - name: Upload corpus results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: corpus-results-${{ matrix.os }}
          path: target/corpus-results/
          if-no-files-found: ignore
