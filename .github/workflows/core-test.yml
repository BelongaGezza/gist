name: core-test
on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      # rust-toolchain.toml pins 1.88.0, so any plain `cargo` invocation in
      # this repo auto-installs and switches to that exact toolchain
      # (rustup's toolchain-file mechanism) — a different, separately-named
      # rustup toolchain from whatever "stable" version the action step
      # above installed (that one's only reachable via `cargo +stable`, per
      # apple-build.yml's uniffi-bindgen step). Passing `components:` to
      # the action attaches clippy/rustfmt to *its* toolchain, not the one
      # rust-toolchain.toml actually selects, so `cargo clippy`/`cargo fmt`
      # below still see a component-less toolchain. Attach components to
      # the right toolchain directly instead.
      - run: rustup component add clippy rustfmt
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --check
      # Release-mode panic containment (review Q1). Unit tests always unwind, so
      # only a release-profile binary can detect `panic = "abort"`, which would
      # turn every FFI panic into a process kill instead of `InternalPanic`.
      - name: Release-mode panic containment
        run: cargo run --release -p gist-ffi --features test-panic --example panic_containment
      # Windows only: the core DLL must not import the dynamic VC++ runtime (review Q2).
      - name: Windows DLL has no dynamic VC++ runtime imports
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p gist-ffi
          bash tools/check-dll-imports.sh target/release/gist_ffi.dll
