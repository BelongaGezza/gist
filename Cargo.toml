[workspace]
resolver = "2"
members = [
    "crates/gist-model",
    "crates/gist-parse-txt",
    "crates/gist-parse-epub",
    "crates/gist-parse-docx",
    "crates/gist-parse-pdf",
    "crates/gist-imageprep",
    "crates/gist-web",
    "crates/gist-rsvp",
    "crates/gist-store",
    "crates/gist-core",
    "crates/gist-ffi",
]

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
uuid        = { version = "1", features = ["v7", "serde"] }
tracing     = "0.1"
sha2        = "0.10"
blake3      = "1"

[profile.release]
# Must stay "unwind". `ffi_catch!` in gist-ffi contains panics with
# `catch_unwind`, which is a no-op under `panic = "abort"`: a release build
# would then kill the host app on any parser/core panic instead of returning
# `GistError::InternalPanic`. Enforced by the release-mode `panic_containment`
# example in CI (docs/review-pre-w1-quality-security.md, Q1).
panic = "unwind"
