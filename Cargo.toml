[workspace]
resolver = "2"
members = [
    "crates/readrrr-model",
    "crates/readrrr-parse-txt",
    "crates/readrrr-parse-epub",
    "crates/readrrr-parse-docx",
    "crates/readrrr-parse-pdf",
    "crates/readrrr-imageprep",
    "crates/readrrr-web",
    "crates/readrrr-rsvp",
    "crates/readrrr-store",
    "crates/readrrr-core",
    "crates/readrrr-ffi",
]

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
uuid        = { version = "1", features = ["v7"] }
tracing     = "0.1"
