[workspace]
resolver = "2"
members = [
    "crates/gist-model",
    "crates/gist-parse-txt",
    "crates/gist-parse-epub",
    "crates/gist-parse-docx",
    "crates/gist-parse-pdf",
    "crates/gist-imageprep",
    "crates/gist-web",
    "crates/gist-rsvp",
    "crates/gist-store",
    "crates/gist-core",
    "crates/gist-ffi",
]

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
uuid        = { version = "1", features = ["v7"] }
tracing     = "0.1"
