name: GIST
options:
  bundleIdPrefix: com.gist
  deploymentTarget:
    macOS: "26.5"
  xcodeVersion: "16"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  GISTmacOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        type: group
      - path: macOS
        type: group
      - path: Generated
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gist.macos
        PRODUCT_NAME: GIST
        MACOSX_DEPLOYMENT_TARGET: "26.5"
        INFOPLIST_FILE: macOS/Info.plist
        # Disable Xcode 14+ script sandboxing so the pre-build script can
        # read the Generated/ directory and check for cached bindings.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - framework: ../../artifacts/GistCore.xcframework
        embed: false
    preBuildScripts:
      - name: Generate uniffi bindings
        script: |
          # Ensure cargo is on PATH (Xcode's build environment omits ~/.cargo/bin)
          export PATH="$HOME/.cargo/bin:$PATH"

          if ! "$SRCROOT/../../tools/gen-bindings.sh"; then
            if [ ! -d "$SRCROOT/Generated" ] || [ -z "$(ls -A "$SRCROOT/Generated" 2>/dev/null)" ]; then
              echo "error: uniffi binding generation failed and no pre-generated bindings exist." >&2
              exit 1
            else
              echo "warning: uniffi binding generation failed; using cached bindings." >&2
            fi
          fi
        basedOnDependencyAnalysis: false
        inputFiles: []
        outputFiles: []

  GISTTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      # Fixture files (plain text, not Swift) copied into the test bundle as
      # resources so tests can look them up at runtime via
      # Bundle(for:).url(forResource:withExtension:) rather than referencing
      # a path into the top-level fixtures/ directory (which isn't guaranteed
      # to exist relative to the test bundle's runtime working directory).
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: GISTmacOS
    settings:
      base:
        # GISTmacOS's PRODUCT_NAME is "GIST" (not the target name), so the
        # default XcodeGen-inferred TEST_HOST/BUNDLE_LOADER (which assume
        # product name == target name) point at a nonexistent GISTmacOS.app.
        # Point them at the real product explicitly.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GIST.app/Contents/MacOS/GIST"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Without this, `xcodebuild test` fails at the CodeSign step with
        # "Cannot code sign because the target does not have an Info.plist
        # file and one is not being generated automatically" -- GISTTests
        # has no INFOPLIST_FILE of its own (unlike GISTmacOS), so it needs
        # Xcode to synthesize one.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GISTmacOS:
    build:
      targets:
        GISTmacOS: all
        GISTTests: [test]
    test:
      targets:
        - GISTTests
