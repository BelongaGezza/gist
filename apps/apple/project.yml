name: GIST
options:
  bundleIdPrefix: com.gist
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  GISTmacOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
        type: group
      - path: macOS
        type: group
      - path: Generated
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gist.macos
        PRODUCT_NAME: GIST
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: macOS/Info.plist
    dependencies:
      - framework: ../../artifacts/GistCore.xcframework
        embed: false
    preBuildScripts:
      - name: Generate uniffi bindings
        script: |
          if ! "$SRCROOT/../../tools/gen-bindings.sh"; then
            if [ ! -d "$SRCROOT/Generated" ] || [ -z "$(ls -A "$SRCROOT/Generated" 2>/dev/null)" ]; then
              echo "error: uniffi binding generation failed and no pre-generated bindings exist." >&2
              exit 1
            else
              echo "warning: uniffi binding generation failed; using cached bindings." >&2
            fi
          fi
        inputFiles: []
        outputFiles: []

  GISTTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: GISTmacOS
